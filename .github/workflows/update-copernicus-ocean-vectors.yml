# 定期從 Copernicus Marine 匯出台灣海域 uo/vo 向量 JSON，並提交回倉庫。
#
# GitHub Actions 預設走 copernicusmarine（CMEMS_USE_COPERNICUSMARINE=1），因雲端 runner
# 對 nrt.cmems-du.eu 直連 OPeNDAP 可能收到非 NetCDF 的 HTML。
# 請在 Repository secrets 設定：
#   CMEMS_USER、CMEMS_PASSWORD — Copernicus Marine 帳密（傳給 copernicusmarine；並寫入 ~/.netrc 供備援）
#   FIREBASE_STORAGE_UPLOADER_SA_JSON（選用）— GCP 服務帳號 JSON，需具備本專案 Storage 物件寫入權限；
#     若設定，匯出後會上傳至 Firebase Storage `ocean/copernicus_ocean_vectors.json`，
#     供 App 執行期 GET（見 `lib/config/ocean_vectors_remote_url.dart`）。未設定則略過上傳。
#
# 排程：每日 18:00 UTC（可改 cron）。亦可於 Actions 分頁手動執行「Run workflow」。

name: Update Copernicus ocean vectors

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: copernicus-ocean-vectors
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    # 在 job env 注入後，step 的 if 可用 env.* 判斷（避免部分環境在 if 內無法解析 secrets 上下文）。
    env:
      FIREBASE_STORAGE_UPLOADER_SA_JSON: ${{ secrets.FIREBASE_STORAGE_UPLOADER_SA_JSON }}
    steps:
      # 使用 Node 24 的 action 版本，避免 checkout@v4／setup-python@v5 的 Node 20 棄用警告
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r tool/requirements-copernicus.txt

      - name: Configure CMEMS .netrc
        env:
          CMEMS_USER: ${{ secrets.CMEMS_USER }}
          CMEMS_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
        run: |
          if [ -n "${CMEMS_USER:-}" ] && [ -n "${CMEMS_PASSWORD:-}" ]; then
            echo "machine nrt.cmems-du.eu login ${CMEMS_USER} password ${CMEMS_PASSWORD}" >> "${HOME}/.netrc"
            chmod 600 "${HOME}/.netrc"
            echo "Configured .netrc for nrt.cmems-du.eu"
          else
            echo "No CMEMS_USER/CMEMS_PASSWORD — open OPeNDAP may still work for some datasets"
          fi

      - name: Export vectors JSON
        env:
          CMEMS_USE_COPERNICUSMARINE: "1"
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
        run: |
          if [ -z "${COPERNICUSMARINE_SERVICE_USERNAME:-}" ] || [ -z "${COPERNICUSMARINE_SERVICE_PASSWORD:-}" ]; then
            echo "::error::未設定 Repository Secrets：CMEMS_USER、CMEMS_PASSWORD（Copernicus Marine 帳密）。雲端 runner 無法使用舊 OPeNDAP，必須由此認證。"
            exit 1
          fi
          python tool/export_copernicus_ocean_vectors.py

      # 未設 secret 時下面「Auth / gsutil / Upload」三步會顯示 Skipped，Firebase 仍會是空的——整個 job 仍可能綠燈。
      - name: "提示：Firebase Storage 上傳（可選）"
        if: ${{ env.FIREBASE_STORAGE_UPLOADER_SA_JSON == '' }}
        run: |
          echo "::notice::未設定 Repository secret「FIREBASE_STORAGE_UPLOADER_SA_JSON」— 已跳過上傳。"
          echo "::notice::Firebase Console 的 fishing-web-ab5ad.firebasestorage.app 不會出現 ocean/ 檔案屬正常。"
          echo "::notice::請到 Settings → Secrets and variables → Actions 新增同名 secret（GCP 服務帳號 JSON 全文）。"

      - name: Auth Google Cloud (Firebase Storage uploader)
        if: ${{ env.FIREBASE_STORAGE_UPLOADER_SA_JSON != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_STORAGE_UPLOADER_SA_JSON }}

      - name: Set up gcloud SDK
        if: ${{ env.FIREBASE_STORAGE_UPLOADER_SA_JSON != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: fishing-web-ab5ad

      - name: Upload ocean vectors to Firebase Storage
        if: ${{ env.FIREBASE_STORAGE_UPLOADER_SA_JSON != '' }}
        run: |
          set -e
          DEST="gs://fishing-web-ab5ad.firebasestorage.app/ocean/copernicus_ocean_vectors.json"
          test -f "assets/data/copernicus_ocean_vectors.json"
          ls -la "assets/data/copernicus_ocean_vectors.json"
          gsutil -h "Content-Type:application/json" \
            -h "Cache-Control:public, max-age=600" \
            cp "assets/data/copernicus_ocean_vectors.json" \
            "${DEST}"
          echo "Uploaded to ${DEST}"
          gsutil ls -l "gs://fishing-web-ab5ad.firebasestorage.app/ocean/"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/copernicus_ocean_vectors.json
          if git diff --staged --quiet; then
            echo "No changes to copernicus_ocean_vectors.json"
          else
            git commit -m "chore(data): refresh Copernicus Taiwan ocean vectors"
            git push
          fi
